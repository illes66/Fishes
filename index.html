    :root {
      --bg: #dfb7b7;

      --ui: #132b3a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;

      background:
        radial-gradient(
          circle at 50% 20%,
          #d8fff5 0,
          #b7fff9 40%,
          #326d68 100%
        );

      font-family: system-ui, Arial, Helvetica;
    }

    .frame {
      border: 2px solid #12c9cfde;
      border-radius: 18px;

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.22);

      overflow: hidden;
      background: #1e727544;
    }

    .console {
      width: min(98vw, 1420px);
      display: grid;
      grid-template-columns: clamp(58px, 12vw, 142px) minmax(0, 1fr) clamp(58px, 12vw, 142px);
      align-items: center;
      gap: clamp(6px, 1.6vw, 22px);
      padding: clamp(8px, 1.5vw, 20px);
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 28px;
      background: linear-gradient(145deg, #77b9a9, #376f72);
      box-shadow: 0 22px 60px rgba(13, 48, 57, 0.3), inset 0 2px 8px rgba(255, 255, 255, 0.25);
    }

    .frame {
      min-width: 0;
      width: 100%;
      border: 2px solid #12c9cfde;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
      overflow: hidden;
      background: #1e727544;
    }

    .control-pad {
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      display: block;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .control-pad:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
      border-radius: 50%;
    }

    .game-canvas {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      background:
        linear-gradient(
          var(--bg) 0 36%,
          var(--sea) 36% 88%,
          var(--sand) 88%
        );

      touch-action: none;
    }

    .legend {
      padding: 10px 14px;
      font-size: 14px;
      color: var(--ui);
    }

    @media (max-width: 520px) {
      .console {
        width: 100vw;
        grid-template-columns: 54px minmax(0, 1fr) 54px;
        gap: 5px;
        padding: 8px 5px;
        border-radius: 16px;
      }

      .frame {
        border-radius: 10px;
      }

      .legend {
        padding: 6px;
        font-size: 10px;
      }
    }

  </style>

</head>

/* ============================================================

   ============================================================ */

function rand(min, max) {

    return Math.random() *
        (max - min) +
        min;

}


/* ============================================================
   IMAGE LOADER
   ============================================================ */

function loadImage(src) {

    return new Promise((resolve) => {

        if (!src) {

            resolve({

                ok: false,

                img: null

            });

            return;

        }


        const img =
            new Image();


        img.onload = () => {

            resolve({

                ok: true,

                img: img

            });

        };


        img.onerror = () => {

            console.warn(
                "Could not load image:",
                src
            );


            resolve({

                ok: false,

                img: null

            });

        };


        img.src = src;

    });

}


/* ============================================================
   LOAD ASSETS
   ============================================================ */

async function loadAssets() {


    /* ========================================================
       FISH 1 + FISH 2
       ======================================================== */

    const fishPromises =
        ASSET_PATHS.fishes.flatMap(
            fish => [

                loadImage(
                    fish.normal
                ),

                loadImage(
                    fish.blink
                )

            ]
        );


    /* ========================================================
       PLANTS
       ======================================================== */

    const plantPromises =
        ASSET_PATHS.plants.map(
            path =>
                loadImage(path)
        );


    /* ========================================================
       OTHER
       ======================================================== */

    const otherPromises = [

        loadImage(
            ASSET_PATHS.rod
        ),

        loadImage(
            ASSET_PATHS.hook
        ),

        loadImage(
            ASSET_PATHS.sea
        ),

        loadImage(
            ASSET_PATHS.boat
        ),

        loadImage(
            ASSET_PATHS.fish3Sheet
        ),

        loadImage(
            ASSET_PATHS.fish4Sheet
        ),

        loadImage(
            ASSET_PATHS.fish5Sheet
        ),

        loadImage(
            ASSET_PATHS.fish3DialogBubble
        ),

        loadImage(
            ASSET_PATHS.fish4DialogBubble
        ),

        loadImage(
            ASSET_PATHS.fish5DialogBubble
        )

    ];


    const results =
        await Promise.all([

            ...fishPromises,

            ...plantPromises,

            ...otherPromises

        ]);


    /* ========================================================
       FISH
       ======================================================== */

    images.fishes = [];


    for (
        let i = 0;
        i < ASSET_PATHS.fishes.length;
        i++
    ) {

        const normalResult =
            results[i * 2];


        const blinkResult =
            results[i * 2 + 1];


        images.fishes.push({

            normal:
                normalResult.ok
                    ? normalResult.img
                    : null,

            blink:
                blinkResult.ok
                    ? blinkResult.img
                    : null

        });

    }


    /* ========================================================
       INDEXES
       ======================================================== */

    const plantStart =
        fishPromises.length;


    const otherStart =
        plantStart +
        plantPromises.length;


    /* ========================================================
       PLANTS
       ======================================================== */

    images.plants = [];


    for (
        let i = 0;
        i < ASSET_PATHS.plants.length;
        i++
    ) {

        const result =
            results[
                plantStart + i
            ];


        images.plants.push(

            result.ok
                ? result.img
                : null

        );

    }


    /* ========================================================
       OTHER ASSETS
       ======================================================== */

    images.rod =
        results[
            otherStart
        ].ok

            ? results[
                otherStart
            ].img

            : null;


    images.hook =
        results[
            otherStart + 1
        ].ok

            ? results[
                otherStart + 1
            ].img

            : null;


    images.sea =

            otherStart + 2

            : null;

            : null;


    images.fish3Sheet =

            otherStart + 4

                otherStart + 4

            : null;


    images.fish4Sheet =
        results[
            otherStart + 5

            : null;


    images.fish5Sheet =

/* ============================================================
   CREATE FISH
   ============================================================ */

function createFish(config) {

    return {

        fishType:
            config.type,


        x:
            config.x,

        y:
            config.y,


        w:
            180,

        h:
            180,


        vx:
            config.direction *
            (
                config.speed ||
                rand(
                    GAME_CONFIG.fishSpeedMin,
                    GAME_CONFIG.fishSpeedMax
                )
            ),


        direction:
            config.direction,


        state:
            FISH_STATE.IDLE,


        hookOffsetX: 0,

        hookOffsetY: 0,


        escapeTimer:
            GAME_CONFIG.fishEscapeTime,


        spriteFrame: 0,

        spriteTimer: 0,


        blinking: false,

        blinkTimer:
            rand(2, 5),


        bubbleTimer:
            rand(2, 6),


        dialog:
            config.dialog || "",


        dialogDelay:
            config.dialogDelay || 0,


        dialogTimer: 0,

        dialogVisible: false,


        /* ====================================================
           DIALOG BUBBLE ANIMATION
           ==================================================== */

        dialogFrame: 0,

        dialogFrameTimer: 0,


        releasedTimer: 0,


        landed: false

    };

}


/* ============================================================

   ============================================================ */

function resetFish() {

    state.fish = [];

    state.nextSpawnIndex = 0;

    state.gameTime = 0;

    state.hookedFish = null;

}


/* ============================================================
   SPAWN CONTROLLED FISH
   ============================================================ */

function updateFishSpawning() {

    while (

        state.nextSpawnIndex <
        FISH_SPAWN_PLAN.length &&

        state.gameTime >=
        FISH_SPAWN_PLAN[
            state.nextSpawnIndex
        ].spawnTime

    ) {

        const config =
            FISH_SPAWN_PLAN[
                state.nextSpawnIndex
            ];


        state.fish.push(
            createFish(config)
        );


        state.nextSpawnIndex++;

    }

}


/* ============================================================
   CREATE PLANTS
   ============================================================ */

function createPlants() {

    state.plants =
        GAME_CONFIG.plants.map(
            (config, index) => {

                return {

                    x:
                        config.x,

                    y:
                        config.y,

                    w:
                        config.w,

                    h:
                        config.h,

                    index:
                        index,

                    frame:
                        0,

                    timer:
                        0,

                    frames:
                        config.frames,

                    fps:
                        config.fps,

                    rows:
                        config.rows,

                    columns:
                        config.columns,

                    layer:
                        config.layer

                };

            }
        );

}


/* ============================================================
   UPDATE PLANTS
   ============================================================ */

function updatePlants(dt) {

    for (
        const plant of state.plants
    ) {

        if (
            plant.fps <= 0
        )
            continue;


        plant.timer += dt;


        const frameDuration =
            1 /
            plant.fps;


        if (
            plant.timer >=
            frameDuration
        ) {

            plant.timer -=
                frameDuration;


            plant.frame++;


            if (
                plant.frame >=
                plant.frames
            ) {

                plant.frame = 0;

            }

        }

    }

}


/* ============================================================
   DRAW PLANTS
   ============================================================ */

function drawPlants() {

    const sortedPlants =
        [...state.plants].sort(
            (a, b) =>
                a.layer - b.layer
        );


    for (
        const plant of sortedPlants
    ) {

        const sheet =
            images.plants[
                plant.index
            ];


        if (!sheet)
            continue;


        const frameWidth =
            sheet.width /
            plant.columns;


        const frameHeight =
            sheet.height /
            plant.rows;


        const column =
            plant.frame %
            plant.columns;


        const row =
            Math.floor(
                plant.frame /
                plant.columns
            );


        const sourceX =
            column *
            frameWidth;


        const sourceY =
            row *
            frameHeight;


        ctx.drawImage(

            sheet,

            sourceX,

            sourceY,

            frameWidth,

            frameHeight,

            plant.x -
                plant.w / 2,

            plant.y -
                plant.h,

            plant.w,

            plant.h

        );

    }

}


/* ============================================================
   CLAMP HOOK
   ============================================================ */

function clampHook() {

    state.hook.x =
        Math.max(

            80,

            Math.min(

                canvas.width - 60,

                state.hook.x

            )

        );


    state.hook.y =
        Math.max(

            110,

            Math.min(

                canvas.height - 40,

                state.hook.y

            )

        );

}

    if (
        f.state !==
        FISH_STATE.IDLE
    )
        return;


    f.state =
        FISH_STATE.HOOKED;


    state.hookedFish =
        f;


    f.vx =
        -Math.sign(
            f.vx || 1
        ) *
        GAME_CONFIG.hookedFishSpeed;


    f.hookOffsetX =
        state.hook.x -
        f.x;


    f.hookOffsetY =
        state.hook.y -
        f.y;


    f.escapeTimer =
        GAME_CONFIG.fishEscapeTime;


    f.spriteFrame = 0;

    f.spriteTimer = 0;


    f.dialogVisible = true;


    state.message =
        "Got one! Now PULL!";


    state.messageTimer =
        1.2;

}


/* ============================================================
   RELEASE FISH
   ============================================================ */

function releaseFish(f) {

    if (!f)
        return;


    f.state =
        FISH_STATE.RELEASED;


    f.releasedTimer = 0;


    f.spriteFrame = 12;

    f.spriteTimer = 0;


    state.hookedFish = null;


    f.vx =
        -Math.sign(
            f.vx || 1
        ) *
        rand(

            GAME_CONFIG.fishSpeedMin,

            GAME_CONFIG.fishSpeedMax

        );


    state.message =
        "It escaped!";


    state.messageTimer =
        1.2;

}


/* ============================================================
   START REELING
   ============================================================ */

function startReeling(f) {

    if (!f)
        return;


    f.state =
        FISH_STATE.REELING;


    f.spriteFrame = 8;

    f.spriteTimer = 0;


    state.message =
        "PULL!";


    state.messageTimer =
        0.4;

}


/* ============================================================
   UPDATE FISH
   ============================================================ */

function updateFish(f, dt) {


    /* ========================================================
       IDLE
       ======================================================== */

    if (
        f.state ===
        FISH_STATE.IDLE
    ) {

        f.x +=
            f.vx *
            dt;


        if (
            f.x < 44 ||
            f.x >
            canvas.width - 44
        ) {

            f.vx *= -1;

        }


        /* ----------------------------------------------------
           BLINK
           ---------------------------------------------------- */

        if (
            f.fishType === 0 ||
            f.fishType === 1
        ) {

            f.blinkTimer -= dt;


            if (
                f.blinkTimer <= 0
            ) {

                f.blinking =
                    !f.blinking;


                if (
                    f.blinking
                ) {

                    f.blinkTimer =
                        0.12;

                }

                else {

                    f.blinkTimer =
                        rand(2, 5);

                }

            }

        }


        updateFishAnimation(
            f,
            "idle",
            dt
        );


        updateFishDialogue(
            f,
            dt
        );


        updateFishBubbles(
            f,
            dt
        );


        updateDialogBubbleAnimation(
            f,
            dt
        );


        /* ----------------------------------------------------
           HOOK COLLISION
           ---------------------------------------------------- */

        const dx =
            f.x -
            state.hook.x;


        const dy =
            f.y -
            state.hook.y;


        if (
            Math.hypot(dx, dy) <
            state.hook.radius +
            f.h * 0.35
        ) {

            hookFish(f);

        }

    }


    /* ========================================================
       HOOKED
       ======================================================== */

    else if (
        f.state ===
        FISH_STATE.HOOKED
    ) {

        f.x +=
            f.vx *
            dt;


        state.hook.x =
            f.x +
            f.hookOffsetX;


        state.hook.y =
            f.y +
            f.hookOffsetY;


        clampHook();


        f.escapeTimer -= dt;


        if (
            f.escapeTimer <= 0
        ) {

            releaseFish(f);

            return;

        }


        if (
            isPulling()
        ) {

            startReeling(f);

            return;

        }


        updateFishAnimation(
            f,
            "hooked",
            dt
        );


        updateFishDialogue(
            f,
            dt
        );


        updateDialogBubbleAnimation(
            f,
            dt
        );

    }


    /* ========================================================
       REELING
       ======================================================== */

    else if (
        f.state ===
        FISH_STATE.REELING
    ) {

        if (
            !isPulling()
        ) {

            f.state =
                FISH_STATE.HOOKED;

            return;

        }


        const dx =
            GAME_CONFIG.boat.x -
            f.x;


        const dy =
            GAME_CONFIG.boat.y -
            f.y;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        if (
            distance > 0
        ) {

            const nx =
                dx /
                distance;


            const ny =
                dy /
                distance;


            f.x +=
                nx *
                GAME_CONFIG.reelSpeed *
                dt;


            f.y +=
                ny *
                GAME_CONFIG.reelSpeed *
                dt;

        }


        state.hook.x =
            f.x +
            f.hookOffsetX;


        state.hook.y =
            f.y +
            f.hookOffsetY;


        updateFishAnimation(
            f,
            "reeling",
            dt
        );


        if (
            distance <=
            GAME_CONFIG.boat.catchRadius
        ) {

            landFish(f);

        }

    }


    /* ========================================================
       RELEASED
       ======================================================== */

    else if (
        f.state ===
        FISH_STATE.RELEASED
    ) {

        f.releasedTimer += dt;


        updateFishAnimation(
            f,
            "released",
            dt
        );


        if (
            f.releasedTimer >=
            0.5
        ) {

            f.state =
                FISH_STATE.IDLE;


            f.dialogVisible =
                false;


            f.escapeTimer =
                GAME_CONFIG.fishEscapeTime;


            f.bubbleTimer =
                rand(2, 6);

        }

    }

}


/* ============================================================
   LAND FISH
   ============================================================ */

function landFish(f) {

    if (
        f.landed
    )
        return;


    f.landed = true;


    f.state =
        FISH_STATE.LANDED;


    state.hookedFish =
        null;


    state.score++;


    spawnSparkles(
        f.x,
        f.y
    );


    state.message =
        "Fish caught! ✨";


    state.messageTimer =
        1.2;


    if (
        state.score >=
        GAME_CONFIG.goal
    ) {

        state.message =
            "You got your new team member!";


        state.messageTimer =
            2;

    }

}


/* ============================================================
   UPDATE FISH ANIMATION
   ============================================================ */

function updateFishAnimation(
    f,
    animationName,
    dt
) {

    if (
        f.fishType < 2
    )
        return;


    const animation =
        GAME_CONFIG
            .spriteAnimations[
                animationName
            ];


    if (!animation)
        return;


    f.spriteTimer += dt;


    const frameDuration =
        1 /
        (
            f.fishType === 2
                ? GAME_CONFIG.fish3FPS
                : f.fishType === 3
                    ? GAME_CONFIG.fish4FPS
                    : GAME_CONFIG.fish5FPS
        );


    if (
        f.spriteTimer >=
        frameDuration
    ) {

        f.spriteTimer -=
            frameDuration;


        const relativeFrame =
            f.spriteFrame -
            animation.start;


        let nextFrame =
            relativeFrame + 1;


        if (
            nextFrame >=
            animation.frames
        ) {

            nextFrame = 0;

        }


        f.spriteFrame =
            animation.start +
            nextFrame;

    }

}


/* ============================================================
   UPDATE DIALOGUE
   ============================================================ */

function updateFishDialogue(
    f,
    dt
) {

    if (!f.dialog)
        return;


    f.dialogTimer += dt;


    if (
        f.dialogTimer >=
        f.dialogDelay
    ) {

        f.dialogVisible =
            true;

    }

}


/* ============================================================
   UPDATE DIALOG BUBBLE ANIMATION
   ============================================================ */

function updateDialogBubbleAnimation(
    f,
    dt
) {

    if (
        !f.dialogVisible
    )
        return;


    if (
        f.fishType < 2
    )
        return;


    f.dialogFrameTimer += dt;


    const frameDuration =
        1 /
        GAME_CONFIG.dialogBubble.fps;


    if (
        f.dialogFrameTimer >=
        frameDuration
    ) {

        f.dialogFrameTimer -=
            frameDuration;


        f.dialogFrame++;


        if (
            f.dialogFrame >=
            GAME_CONFIG.dialogBubble.frames
        ) {

            f.dialogFrame = 0;

        }

    }

}


/* ============================================================
   UPDATE FISH BUBBLES
   ============================================================ */

function updateFishBubbles(
    f,
    dt
) {

    f.bubbleTimer -= dt;


    if (
        f.bubbleTimer <= 0
    ) {

        spawnBubble(f);


        f.bubbleTimer =
            rand(0.5, );

    }

}


/* ============================================================
   SPAWN SPARKLES
   ============================================================ */

function spawnSparkles(x, y) {

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const angle =
            Math.PI *
            2 *
            i /
            18;


        const speed =
            rand(30, 120);


        state.sparkles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                GAME_CONFIG.sparkleLife

        });

    }

}


/* ============================================================
   SPAWN BUBBLE
   ============================================================ */

function spawnBubble(f) {

    state.bubbles.push({

        x:
            f.x +
            rand(-15, 15),

        y:
            f.y - 20,

        radius:
            rand(2, 5),

        vx:
            rand(-8, 8),

        vy:
            rand(-25, -45),

        life: 1,

        maxLife: 1

    });

}


/* ============================================================
   UPDATE BUBBLES
   ============================================================ */

function updateBubbles(dt) {

    state.bubbles =
        state.bubbles.filter(
            b => {

                b.life -= dt;


                b.x +=
                    b.vx *
                    dt;


                b.y +=
                    b.vy *
                    dt;


                b.vx *=
                    0.98;


                return (
                    b.life > 0
                );

            }
        );

}


/* ============================================================
   UPDATE GAME
   ============================================================ */

function update(dt) {

    state.gameTime += dt;


    state.environmentTime += dt;


    updateFishSpawning();


    updatePlants(dt);


    for (
        const f of state.fish
    ) {

        updateFish(
            f,
            dt
        );

    }


    state.fish =
        state.fish.filter(
            f =>
                f.state !==
                FISH_STATE.LANDED
        );


    state.sparkles =
        state.sparkles.filter(
            p => {

                p.life -= dt;


                p.x +=
                    p.vx *
                    dt;


                p.y +=
                    p.vy *
                    dt;


                p.vx *=
                    0.96;


                p.vy *=
                    0.96;


                return (
                    p.life > 0
                );

            }
        );


    updateBubbles(dt);


    if (
        state.messageTimer > 0
    ) {

        state.messageTimer -= dt;

    }

}


/* ============================================================
   DRAW ENVIRONMENT
   ============================================================

   Este es el BACKGROUND REAL del juego.

   NO utilizamos una imagen de fondo.

   ============================================================ */

function drawEnvironment() {

    const width =
        canvas.width;


    const height =
        canvas.height;


    const env =
        GAME_CONFIG.environment;


    /* ========================================================
       SKY
       ======================================================== */

    const skyEnd =
        height *
        env.skyHeight;


    const skyGradient =
        ctx.createLinearGradient(

            0,
            0,

            0,
            skyEnd

        );


    skyGradient.addColorStop(
        0,
        env.skyColorTop
    );


    skyGradient.addColorStop(
        1,
        env.skyColorBottom
    );


    ctx.fillStyle =
        skyGradient;


    ctx.fillRect(

        0,
        0,

        width,
        skyEnd

    );


    /* ========================================================
       WATER
       ======================================================== */

    const waterStart =
        height *
        env.waterStart;


    const waterEnd =
        height *
        env.waterEnd;


    const waterGradient =
        ctx.createLinearGradient(

            0,
            waterStart,

            0,
            waterEnd

        );


    waterGradient.addColorStop(
        0,
        env.waterTopColor
    );


    waterGradient.addColorStop(
        1,
        env.waterBottomColor
    );


    ctx.fillStyle =
        waterGradient;


    ctx.fillRect(

        0,

        waterStart,

        width,

        waterEnd -
        waterStart

    );


    /* ========================================================
       SAND
       ======================================================== */

    const sandStart =
        height *
        env.sandStart;


    const sandGradient =
        ctx.createLinearGradient(

            0,
            sandStart,

            0,
            height

        );


    sandGradient.addColorStop(
        0,
        env.sandColorTop
    );


    sandGradient.addColorStop(
        1,
        env.sandColorBottom
    );


    ctx.fillStyle =
        sandGradient;


    ctx.fillRect(

        0,

        sandStart,

        width,

        height -
        sandStart

    );


    /* ========================================================
       HORIZON / TRANSITION

       Suavizamos visualmente la separación entre cielo
       y agua.

       ======================================================== */

    ctx.save();


    const horizonGradient =
        ctx.createLinearGradient(

            0,

            waterStart - 30,

            0,

            waterStart + 30

        );


    horizonGradient.addColorStop(
        0,
        "rgba(255,190,190,0)"
    );


    horizonGradient.addColorStop(
        0.5,
        "rgba(255,190,190,0.35)"
    );


    horizonGradient.addColorStop(
        1,
        "rgba(255,190,190,0)"
    );


    ctx.fillStyle =
        horizonGradient;


    ctx.fillRect(

        0,

        waterStart - 30,

        width,

        60

    );


    ctx.restore();

}


/* ============================================================
   DRAW SEA
   ============================================================

   IMPORTANTE:

   El sea se dibuja DESPUÉS del environment.

   Pero ANTES de:

      BOAT
      PLANTS
      FISH

   Por tanto la transparencia del sea NO afecta a los peces.

   ============================================================ */

function drawSea() {

    if (
        !images.sea
    )
        return;


    const seaConfig =
        GAME_CONFIG.sea;


    /* ========================================================
       MOVIMIENTO DE LAS OLAS
       ======================================================== */

    const t =
        state.environmentTime *
        seaConfig.movementSpeed;


    const offsetX =
        Math.sin(t) *
        seaConfig.moveX;


    const offsetY =
        Math.cos(t * 0.8) *
        seaConfig.moveY;


    const drawW =
        seaConfig.w ||
        canvas.width;


    const drawH =
        seaConfig.h ||
        canvas.height;


    /* ========================================================
       LIGHT / SHADOW EFFECT

       La sombra se genera alrededor de la propia imagen
       de las olas.

       ======================================================== */

    ctx.save();


    ctx.globalAlpha =
        seaConfig.alpha;


    ctx.shadowColor =
        "rgba(255,255,255,0.42)";


    ctx.shadowBlur =
        seaConfig.shadowBlur;


    ctx.shadowOffsetX =
        0;


    ctx.shadowOffsetY =
        seaConfig.shadowOffsetY;


    ctx.drawImage(

        images.sea,

        offsetX,

        offsetY,

        drawW,

        drawH

    );


    ctx.restore();


    /* ========================================================
       SEGUNDA PASADA MUY SUAVE

       Refuerza ligeramente las ondas sin aumentar
       demasiado la opacidad.

       ======================================================== */

    ctx.save();


    ctx.globalAlpha =
        seaConfig.alpha *
        0.1;


    ctx.drawImage(

        images.sea,

        -offsetX * 0.5,

        -offsetY * 0.5,

        drawW,

        drawH

    );


    ctx.restore();


    ctx.globalAlpha = 1;

}


/* ============================================================
   DRAW BOAT
   ============================================================ */

function drawBoat() {

    if (
        images.boat
    ) {

        const boatConfig =
            GAME_CONFIG.boatAnimation;


        const t =
            state.environmentTime;


        /* ====================================================
           OSCILLATION
           ==================================================== */

        const rotation =
            Math.sin(
                t *
                boatConfig.rotationSpeed
            ) *
            boatConfig.rotationAmount;


        const bob =
            Math.sin(
                t *
                boatConfig.bobSpeed
            ) *
            boatConfig.bobAmount;


        ctx.save();


        ctx.translate(

            GAME_CONFIG.boat.x,

            GAME_CONFIG.boat.y +
            bob

        );


        ctx.rotate(
            rotation
        );


        ctx.drawImage(

            images.boat,

            -GAME_CONFIG.boat.w / 2,

            -GAME_CONFIG.boat.h / 2,

            GAME_CONFIG.boat.w,

            GAME_CONFIG.boat.h

        );


        ctx.restore();

    }

    else {

        /* ----------------------------------------------------
           PLACEHOLDER
           ---------------------------------------------------- */

        ctx.save();


        ctx.fillStyle =
            "rgba(255,255,255,0.18)";


        ctx.beginPath();


        ctx.arc(

            GAME_CONFIG.boat.x,

            GAME_CONFIG.boat.y,

            GAME_CONFIG.boat.catchRadius,

            0,

            Math.PI * 2

        );


        ctx.fill();


        ctx.restore();

    }

}


/* ============================================================
   GET FISH SHEET
   ============================================================ */

function getFishSheet(type) {

    if (
        type === 2
    )
        return images.fish3Sheet;


    if (
        type === 3
    )
        return images.fish4Sheet;


    if (
        type === 4
    )
        return images.fish5Sheet;


    return null;

}


/* ============================================================
   DRAW FISH
   ============================================================ */

function drawFish(f) {

    const facingRight =
        f.vx >= 0;


    const targetW =
        120;


    const targetH =
        120;


    ctx.save();


    ctx.translate(
        f.x,
        f.y
    );


    ctx.scale(

        facingRight
            ? 1
            : -1,

        1

    );


    /* ========================================================
       FISH 3-5
       ======================================================== */

    if (
        f.fishType >= 2
    ) {

        const sheet =
            getFishSheet(
                f.fishType
            );


        if (sheet) {

            drawFishSpriteSheet(

                sheet,

                f.spriteFrame,

                4,

                4,

                targetW,

                targetH

            );

        }

    }


    /* ========================================================
       FISH 1 + FISH 2
       ======================================================== */

    else {

        const fish =
            images.fishes[
                f.fishType
            ];


        if (fish) {

            const sprite =
                f.blinking &&
                fish.blink

                    ? fish.blink

                    : fish.normal;


            if (sprite) {

                ctx.drawImage(

                    sprite,

                    -targetW / 2,

                    -targetH / 2,

                    targetW,

                    targetH

                );

            }

        }

    }


    ctx.restore();


    /* ========================================================
       DIALOGUE
       ======================================================== */

    if (
        f.dialogVisible &&
        f.dialog
    ) {

        drawFishDialogue(f);

    }

}


/* ============================================================
   DRAW FISH SPRITE SHEET
   ============================================================ */

function drawFishSpriteSheet(

    sheet,

    frame,

    rows,

    columns,

    targetW,

    targetH

) {

    const frameWidth =
        sheet.width /
        columns;


    const frameHeight =
        sheet.height /
        rows;


    const column =
        frame %
        columns;


    const row =
        Math.floor(
            frame /
            columns
        );


    const sourceX =
        column *
        frameWidth;


    const sourceY =
        row *
        frameHeight;


    ctx.drawImage(

        sheet,

        sourceX,

        sourceY,

        frameWidth,

        frameHeight,

        -targetW / 2,

        -targetH / 2,

        targetW,

        targetH

    );

}


/* ============================================================
   GET DIALOGUE BUBBLE
   ============================================================ */

function getDialogBubble(fishType) {

    if (
        fishType === 2
    )
        return images.fish3DialogBubble;


    if (
        fishType === 3
    )
        return images.fish4DialogBubble;


    if (
        fishType === 4
    )
        return images.fish5DialogBubble;


    return null;

}


/* ============================================================
   DRAW DIALOGUE BUBBLE
   ============================================================

   SPRITE SHEET:

       0 | 1
       -----
       2 | 3

   ============================================================ */

function drawFishDialogue(f) {

    if (
        !f.dialogVisible ||
        !f.dialog
    )
        return;


    const padding =
        10;


    const maxWidth =
        180;


    ctx.save();


    ctx.font =
        "700 15px Arial";


    const measuredTextWidth =
        ctx.measureText(
            f.dialog
        ).width;


    const bubbleWidth =
        Math.min(

            measuredTextWidth +
            padding * 2,

            maxWidth

        );


    const bubbleHeight =
        42;


    const bubbleX =
        f.x -
        bubbleWidth / 2;


    const bubbleY =
        f.y -
        85;


    /* ========================================================
       GET IMAGE
       ======================================================== */

    const bubbleImage =
        getDialogBubble(
            f.fishType
        );


    const useImageBubble =
        bubbleImage &&
        bubbleImage.complete &&
        bubbleImage.naturalWidth > 0;


    /* ========================================================
       IMAGE BUBBLE
       ======================================================== */

    if (
        useImageBubble
    ) {

        const rows =
            GAME_CONFIG.dialogBubble.rows;


        const columns =
            GAME_CONFIG.dialogBubble.columns;


        const frameWidth =
            bubbleImage.width /
            columns;


        const frameHeight =
            bubbleImage.height /
            rows;


        const frame =
            f.dialogFrame %
            4;


        const column =
            frame %
            columns;


        const row =
            Math.floor(
                frame /
                columns
            );


        const sourceX =
            column *
            frameWidth;


        const sourceY =
            row *
            frameHeight;


        ctx.drawImage(

            bubbleImage,

            sourceX,

            sourceY,

            frameWidth,

            frameHeight,

            bubbleX,

            bubbleY,

            bubbleWidth,

            bubbleHeight

        );

    }


    /* ========================================================
       FALLBACK CANVAS BUBBLE
       ======================================================== */

    else {

        ctx.fillStyle =
            "#ffffff";


        ctx.strokeStyle =
            "#222222";


        ctx.lineWidth =
            2;


        ctx.beginPath();


        ctx.roundRect(

            bubbleX,

            bubbleY,

            bubbleWidth,

            bubbleHeight,

            10

        );


        ctx.fill();


        ctx.stroke();


        /* ----------------------------------------------------
           TAIL
           ---------------------------------------------------- */

        ctx.beginPath();


        ctx.moveTo(

            f.x - 8,

            bubbleY +
            bubbleHeight

        );


        ctx.lineTo(

            f.x,

            bubbleY +
            bubbleHeight +
            10

        );


        ctx.lineTo(

            f.x + 8,

            bubbleY +
            bubbleHeight

        );


        ctx.closePath();


        ctx.fill();


        ctx.stroke();

    }


    /* ========================================================
       TEXT

       El texto continúa siendo Canvas.

       ======================================================== */

    ctx.fillStyle =
        "#222222";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(

        f.dialog,

        f.x,

        bubbleY +
        bubbleHeight / 2

    );


    ctx.restore();

}


/* ============================================================
   DRAW BUBBLES
   ============================================================ */

function drawBubbles() {

    for (
        const b of state.bubbles
    ) {

        ctx.save();


        ctx.globalAlpha =
            Math.max(

                0,

                b.life /
                b.maxLife

            );


        ctx.strokeStyle =
            "#ffffff";


        ctx.lineWidth =
            2;


        ctx.beginPath();


        ctx.arc(

            b.x,

            b.y,

            b.radius,

            0,

            Math.PI * 2

        );


        ctx.stroke();


        ctx.restore();

    }


    ctx.globalAlpha = 1;

}


/* ============================================================
   DRAW ROD
   ============================================================ */

function getRodTip() {

    const angle = -rodRotationDegrees * Math.PI / 180;
    const tipFromPivotX = ROD_TIP.x - ROD_PIVOT.x;
    const tipFromPivotY = ROD_TIP.y - ROD_PIVOT.y;

    return {
        x: ROD_PIVOT.x + tipFromPivotX * Math.cos(angle) - tipFromPivotY * Math.sin(angle),
        y: ROD_PIVOT.y + tipFromPivotX * Math.sin(angle) + tipFromPivotY * Math.cos(angle)
    };
}


function drawRod() {

    /* ========================================================
       PNG ROD

       Cuando quieras utilizarlo:

       ASSET_PATHS.rod = "rod.png";

       Keep the image's handle at (70, 40) and its tip at (280, 150) so the
       rotating line attachment continues to match the art.

       ======================================================== */

    if (
        images.rod
    ) {

        ctx.save();
        ctx.translate(ROD_PIVOT.x, ROD_PIVOT.y);
        ctx.rotate(-rodRotationDegrees * Math.PI / 180);
        ctx.drawImage(
            images.rod,
            -30,
            -20,
            260,
            170
        );
        ctx.restore();

    }

    else {

        /* ====================================================
           ROD CREADO CON CANVAS
           ==================================================== */

        ctx.save();

        ctx.translate(ROD_PIVOT.x, ROD_PIVOT.y);
        ctx.rotate(-rodRotationDegrees * Math.PI / 180);

        ctx.strokeStyle =
            "#8b5e34";


        ctx.lineWidth =
            8;


        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );


        ctx.quadraticCurveTo(

            140,
            -10,

            210,
            110

        );


        ctx.stroke();


        ctx.restore();

    }

    /*
     * Placeholder reel: replace this circle with the finished reel PNG when
     * the art is ready (keep its center aligned with the rod).
     */
    ctx.save();
    ctx.translate(ROD_PIVOT.x, ROD_PIVOT.y);
    ctx.rotate(-rodRotationDegrees * Math.PI / 180);
    ctx.fillStyle = "#8b5e34";
    ctx.beginPath();
    ctx.arc(21, 8, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#d8ad72";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(21, 8, 6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

}


/* ============================================================
   DRAW HOOK
   ============================================================ */

function drawHook() {

    const tip = getRodTip();
    const line = GAME_CONFIG.fishingLine;
    const dx = state.hook.x - tip.x;
    const dy = state.hook.y - tip.y;
    const lineLength = Math.hypot(dx, dy);
    const lineMotion = Math.min(1, lineLength / line.slackDistance);
    const time = state.environmentTime;
    const steps = 32;

    ctx.strokeStyle =
        "#eaf5ff";


    ctx.lineWidth =
        2;


    ctx.beginPath();


    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);

    for (let step = 1; step <= steps; step++) {
        const progress = step / steps;
        const envelope = Math.sin(progress * Math.PI);
        const parabolicSag = line.sag * lineMotion * 4 * progress * (1 - progress);
        const softWave =
            Math.sin(progress * Math.PI * line.waveFrequency + time * line.waveSpeed) *
            line.waveAmplitude *
            lineMotion *
            envelope;
        const waterDrift =
            Math.sin(progress * Math.PI * 3 - time * line.waveSpeed * 0.7) *
            line.waterForce *
            lineMotion *
            envelope;

        ctx.lineTo(
            tip.x + dx * progress,
            tip.y + dy * progress + parabolicSag + softWave + waterDrift
        );
    }

    ctx.stroke();


    /* ========================================================
       HOOK IMAGE
       ======================================================== */

    if (
        images.hook
    ) {

        ctx.drawImage(

            images.hook,

            state.hook.x - 18,

            state.hook.y - 18,

            36,

            36

        );

    }

    else {

        /* ====================================================
           CANVAS HOOK
           ==================================================== */

        ctx.strokeStyle =
            "#d6eef9";


        ctx.lineWidth =
            3;


        ctx.beginPath();


        ctx.arc(

            state.hook.x,

            state.hook.y,

            14,

            -0.4,

            Math.PI * 1.3

        );


        ctx.stroke();

    }

}


/* ============================================================
   DRAW SPARKLES
   ============================================================ */

function drawSparkles() {

    for (
        const p of state.sparkles
    ) {

        ctx.globalAlpha =
            Math.max(

                0,

                p.life /
                GAME_CONFIG.sparkleLife

            );


        ctx.fillStyle =
            "#fff7a8";


        ctx.fillRect(

            p.x - 2,

            p.y - 2,

            4,

            4

        );

    }


    ctx.globalAlpha = 1;

}


/* ============================================================
   DRAW UI
   ============================================================ */

function drawUI() {

    /* ========================================================
       SCORE
       ======================================================== */

    ctx.fillStyle =
        "#000000";


    ctx.font =
        "700 28px Arial, Helvetica, sans-serif";


    ctx.fillText(

        `Peces: ${state.score}/${GAME_CONFIG.goal}`,

        20,

        40

    );


    /* ========================================================
       MESSAGE
       ======================================================== */

    if (
        state.messageTimer > 0
    ) {

        ctx.fillStyle =
            "#ffffff";


        ctx.strokeStyle =
            "rgba(0,0,0,.26)";


        ctx.lineWidth =
            4;


        ctx.font =
            "800 42px Arial, Helvetica, sans-serif";


        const textW =
            ctx.measureText(
                state.message
            ).width;


        const textX =
            (
                canvas.width -
                textW
            ) *
            0.5;


        const textY =
            90;


        ctx.strokeText(

            state.message,

            textX,

            textY

        );


        ctx.fillText(

            state.message,

            textX,

            textY

        );

    }

}


/* ============================================================
   DRAW SCENE
   ============================================================

   ORDEN DE CAPAS

   ------------------------------------------------------------

   1  ENVIRONMENT
      cielo
      rosa
      agua
      arena

   2  SEA
      ondas + transparencia + luz

   3  BOAT
      barca animada

   4  PLANTS
      plantas

   5  FISH
      peces

   6  BUBBLES
      burbujas físicas

   7  ROD
      caña

   8  LINE + HOOK

   9  SPARKLES

   10 UI

   ============================================================ */

function drawScene() {

    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    /* ========================================================
       1. ENVIRONMENT
       ======================================================== */

    drawEnvironment();


    /* ========================================================
       2. SEA
       ======================================================== */

    drawSea();


    /* ========================================================
       3. BOAT
       ======================================================== */

    drawBoat();


    /* ========================================================
       4. PLANTS
       ======================================================== */

    drawPlants();


    /* ========================================================
       5. FISH
       ======================================================== */

    state.fish.forEach(
        drawFish
    );


    /* ========================================================
       6. BUBBLES
       ======================================================== */

    drawBubbles();


    /* ========================================================
       7. ROD
       ======================================================== */

    drawRod();


    /* ========================================================
       8. HOOK + LINE
       ======================================================== */

    drawHook();


    /* ========================================================
       9. SPARKLES
       ======================================================== */

    drawSparkles();


    /* ========================================================
       10. UI
       ======================================================== */

    drawUI();

}


/* ============================================================
   HANDHELD CONTROL PADS
   ============================================================ */

function drawControlPads() {

    /*
     * These canvas-drawn shapes are placeholders: replace the drawing below
     * with drawImage() calls when the final D-pad and radial-pad PNGs are ready.
     */
    const ctx = directionPadContext;
    const center = directionPad.width / 2;

    ctx.clearRect(0, 0, directionPad.width, directionPad.height);
    ctx.fillStyle = "rgba(16, 42, 54, 0.24)";
    ctx.beginPath();
    ctx.arc(center, center, 68, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#173746";
    ctx.beginPath();
    ctx.moveTo(54, 10);
    ctx.lineTo(90, 10);
    ctx.lineTo(90, 54);
    ctx.lineTo(134, 54);
    ctx.lineTo(134, 90);
    ctx.lineTo(90, 90);
    ctx.lineTo(90, 134);
    ctx.lineTo(54, 134);
    ctx.lineTo(54, 90);
    ctx.lineTo(10, 90);
    ctx.lineTo(10, 54);
    ctx.lineTo(54, 54);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#89d6c5";
    ctx.beginPath();
    ctx.arc(center, center, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#effff8";
    ctx.font = "bold 20px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("↑", center, 31);
    ctx.fillText("↓", center, 113);
    ctx.fillText("←", 31, center);
    ctx.fillText("→", 113, center);

    /* Replace this radial placeholder with the final round-control PNG. */
    const radial = reelPadContext;
    radial.clearRect(0, 0, reelPad.width, reelPad.height);
    radial.fillStyle = "rgba(16, 42, 54, 0.24)";
    radial.beginPath();
    radial.arc(center, center, 68, 0, Math.PI * 2);
    radial.fill();
    radial.fillStyle = "#173746";
    radial.beginPath();
    radial.arc(center, center, 54, 0, Math.PI * 2);
    radial.fill();
    radial.strokeStyle = "#89d6c5";
    radial.lineWidth = 2;
    radial.beginPath();
    radial.arc(center, center, 36, 0, Math.PI * 2);
    radial.stroke();
    radial.fillStyle = "#effff8";
    radial.font = "bold 17px system-ui";
    radial.textAlign = "center";
    radial.textBaseline = "middle";
    radial.fillText("↖", 37, 39);
    radial.fillText("↑", center, 27);
    radial.fillText("↗", 107, 39);
    radial.fillText("←", 27, center);
    radial.fillText("•", center, center);
    radial.fillText("→", 117, center);
    radial.fillText("↙", 37, 107);
    radial.fillText("↓", center, 117);
    radial.fillText("↘", 107, 107);
}


function updatePadInput(pad, side, event) {

    const rect = pad.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    const y = ((event.clientY - rect.top) / rect.height) * 2 - 1;
    const distance = Math.hypot(x, y);
    let inputX = 0;
    let inputY = 0;

    if (distance > 0.2) {
        if (side === "right") {
            if (Math.abs(x) > Math.abs(y)) {
                inputX = Math.sign(x);
            } else {
                inputY = Math.sign(y);
            }
        }
    }

    if (side === "right") {
        controlInput.rightX = inputX;
        controlInput.rightY = inputY;
    } else {
        /* Holding or dragging the radial pad engages the reel immediately. */
        controlInput.reeling = true;
    }
}


function connectPad(pad, side) {

    let pointerId = null;

    const release = () => {
        pointerId = null;
        if (side === "right") {
            controlInput.rightX = 0;
            controlInput.rightY = 0;
        } else {
            controlInput.reeling = false;
        }
    };

    pad.addEventListener("pointerdown", event => {
        event.preventDefault();
        pointerId = event.pointerId;
        pad.setPointerCapture(pointerId);
        updatePadInput(pad, side, event);
    });

    pad.addEventListener("pointermove", event => {
        if (event.pointerId === pointerId) {
            updatePadInput(pad, side, event);
        }
    });

    pad.addEventListener("pointerup", release);
    pad.addEventListener("pointercancel", release);
    pad.addEventListener("lostpointercapture", release);
}


connectPad(reelPad, "left");
connectPad(directionPad, "right");
drawControlPads();

window.addEventListener("blur", () => {
    controlInput.rightX = 0;
    controlInput.rightY = 0;
    controlInput.reeling = false;
    keyState.clear();
    keyboardReel = false;
    lastWPress = 0;
});


/* ============================================================
   KEYBOARD INPUT
   ============================================================ */

const keyState =
    new Set();

let lastWPress = 0;
let keyboardReel = false;


window.addEventListener(

    "keydown",

    e => {

        const key = e.key.toLowerCase();
        if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(key)) {
            e.preventDefault();
        }

        keyState.add(
            key
        );

        if (key === "w") {
            lastWPress = Date.now();
        } else if (
            key === "a" &&
            lastWPress &&
            Date.now() - lastWPress <= GAME_CONFIG.reelComboWindow
        ) {
            keyboardReel = true;
            lastWPress = 0;
        }

    }

);


window.addEventListener(

    "keyup",

    e => {

        keyState.delete(
            e.key.toLowerCase()
        );

        if (e.key.toLowerCase() === "a") {
            keyboardReel = false;
        }

        if (e.key.toLowerCase() === "w" && !keyboardReel) {
            lastWPress = 0;
        }

    }

);


/* ============================================================
   UPDATE INPUT
   ============================================================ */

function updateInput(dt) {

    const raiseRod =
        keyState.has("a") ||
        keyState.has("arrowleft") ||
        controlInput.rightX < 0;
    const lowerRod =
        keyState.has("d") ||
        keyState.has("arrowright") ||
        controlInput.rightX > 0;

    if (raiseRod !== lowerRod) {
        rodTargetDegrees = raiseRod
            ? GAME_CONFIG.rodRotation.maxDegrees
            : GAME_CONFIG.rodRotation.minDegrees;
    }

    const rotationStep = GAME_CONFIG.rodRotation.speedDegreesPerSecond * dt;
    if (rodRotationDegrees < rodTargetDegrees) {
        rodRotationDegrees = Math.min(rodTargetDegrees, rodRotationDegrees + rotationStep);
    } else if (rodRotationDegrees > rodTargetDegrees) {
        rodRotationDegrees = Math.max(rodTargetDegrees, rodRotationDegrees - rotationStep);
    }

    if (
        state.hookedFish
    ) {

        return;

    }


    const pulling = isPulling() && !state.hookedFish;

    if (pulling) {
        const tip = getRodTip();
        const targetX = Math.max(80, Math.min(canvas.width - 60, tip.x));
        const targetY = Math.max(110, Math.min(canvas.height - 40, tip.y));
        const dx = targetX - state.hook.x;
        const dy = targetY - state.hook.y;
        const distance = Math.hypot(dx, dy);
        const reelDistance = Math.min(distance, GAME_CONFIG.reelSpeed * dt);

        if (distance > 0) {
            const reelFactor = reelDistance / distance;
            state.hook.x += dx * reelFactor;
            state.hook.y += dy * reelFactor;
        }
    } else {
        const moveY =
            Number(keyState.has("arrowdown") || keyState.has("s")) -
            Number(keyState.has("arrowup") || keyState.has("w")) +
            controlInput.rightY;

        state.hook.y += moveY * GAME_CONFIG.hookMoveSpeed * dt;
    }

    clampHook();

}


/* ============================================================
   POINTER → HOOK
   ============================================================ */

function pointerToHook(evt) {

    if (
        state.hookedFish
    )
        return;


    const rect =
        canvas.getBoundingClientRect();


    const x =
        (

            (
                evt.clientX -
                rect.left
            ) /

            rect.width

        ) *

        canvas.width;


    const y =
        (

            (
                evt.clientY -
                rect.top
            ) /

            rect.height

        ) *

        canvas.height;


    state.hook.x =
        x;


    state.hook.y =
        y;


    clampHook();

}


/* ============================================================
   POINTER EVENTS
   ============================================================ */

canvas.addEventListener(

    "pointerdown",

    pointerToHook

);


canvas.addEventListener(

    "pointermove",

    e => {

        if (
            e.buttons
        ) {

            pointerToHook(e);

        }

    }

);


/* ============================================================
   GAME LOOP
   ============================================================ */

let last = 0;


function loop(ts) {

    const dt =
        Math.min(

            0.033,

            (
                ts -
                last
            ) /
            1000

            || 0.016

        );


    last =
        ts;


    updateInput(dt);


    update(dt);


    drawScene();


    requestAnimationFrame(
        loop
    );

}


/* ============================================================
   START GAME
   ============================================================ */

loadAssets()

    .then(() => {


        /* ----------------------------------------------------
           FISH
           ---------------------------------------------------- */

        resetFish();


        /* ----------------------------------------------------
           PLANTS
           ---------------------------------------------------- */

        createPlants();


        /* ----------------------------------------------------
           START
           ---------------------------------------------------- */

        requestAnimationFrame(
            loop
        );

    });

</script>
